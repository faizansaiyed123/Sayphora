# Production-style stack: PostgreSQL + the Sayphora app.
#   cp .env.example .env   (then fill in the required secrets)
#   docker compose up -d --build
#   docker compose run --rm app node dist-server/cli.js seed      # starter catalogue + admin from .env
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sayphora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sayphora
    volumes:
      - pgdata:/var/lib/postgresql/data          # persistent storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sayphora -d sayphora"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host. Uncomment to connect with psql from your machine:
    # ports: ["127.0.0.1:5432:5432"]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://sayphora:${POSTGRES_PASSWORD}@db:5432/sayphora
      RUN_MIGRATIONS_ON_START: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Behind HTTPS keep COOKIE_SECURE=true. For plain-http local testing of this stack set it to false.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TAX_RATE: ${TAX_RATE:-0.08875}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-Sayphora <no-reply@example.com>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pgdata:

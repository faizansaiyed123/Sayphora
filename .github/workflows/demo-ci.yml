name: Sayphora demo CI
on:
  push:
    branches: [demo]
  pull_request:
    branches: [demo]

permissions:
  contents: read

jobs:
  demo-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_DEMO_MODE: 'true'
